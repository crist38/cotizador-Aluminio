<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingresar | Sistema de Pautas de Corte</title>
  <link rel="icon" type="image/jpeg" href="/logo.jpg" />
  <style>
    :root { color-scheme: light dark; --fondo: #f3f4f6; --panel: #ffffff; --texto: #111827; --suave: #6b7280; --borde: #d1d5db; --acento: #2563eb; --error: #b91c1c; }
    @media (prefers-color-scheme: dark) {
      :root { --fondo: #111827; --panel: #1f2937; --texto: #f9fafb; --suave: #9ca3af; --borde: #374151; --acento: #3b82f6; --error: #fca5a5; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--fondo); color: var(--texto); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    form { width: 100%; max-width: 360px; padding: 32px 24px; background: var(--panel); border: 1px solid var(--borde); border-radius: 12px; }
    img { display: block; height: 56px; margin: 0 auto 16px; border-radius: 8px; }
    h1 { margin: 0 0 24px; font-size: 1.15rem; text-align: center; }
    label { display: block; margin-bottom: 6px; font-size: 0.875rem; color: var(--suave); }
    input { width: 100%; padding: 10px 12px; font-size: 1rem; color: inherit; background: transparent; border: 1px solid var(--borde); border-radius: 8px; }
    button { width: 100%; margin-top: 16px; padding: 10px 12px; font-size: 1rem; font-weight: 600; color: #fff; background: var(--acento); border: 0; border-radius: 8px; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: wait; }
    p { min-height: 1.25rem; margin: 12px 0 0; font-size: 0.875rem; color: var(--error); text-align: center; }
  </style>
</head>
<body>
  <form id="login">
    <img src="/logo.jpg" alt="Logo" />
    <h1>Sistema de Pautas de Corte</h1>
    <label for="password">Contraseña</label>
    <input id="password" type="password" autocomplete="current-password" required autofocus />
    <button type="submit">Ingresar</button>
    <p id="error" role="alert"></p>
  </form>
  <script>
    const form = document.getElementById('login');
    const error = document.getElementById('error');
    const boton = form.querySelector('button');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      boton.disabled = true;
      error.textContent = '';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('password').value }),
        });
        if (res.ok) {
          location.replace('/');
          return;
        }
        const json = await res.json().catch(() => ({}));
        error.textContent = json.error || `Error ${res.status}`;
      } catch (e) {
        error.textContent = 'No se pudo conectar con el servidor';
      }
      boton.disabled = false;
    });
  </script>
</body>
</html>
